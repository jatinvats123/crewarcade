# Render Blueprint: the CrewArcade server as ONE Docker web service (API, webhooks, pg-boss
# workers, Playwright playtest worker). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: crewarcade-server
    runtime: docker
    region: singapore # next to Nexconn SG and Supabase ap-southeast-1
    # FREE FOR NOW (512 MB, 0.1 CPU, sleeps after 15 min idle, 750 h/month): chat, Pixel, Forge
    # builds, play, scores, bug reports and voice work; headless Chromium does not fit, so Glitch's
    # playtests / repros and Forge's smoke test are off (PLAYTESTS=false, FORGE_SMOKE=false) and
    # nothing can be published. Full product: plan: standard (2 GB), set both back to 'true', and
    # move the migration back to `preDeployCommand: node dist/migrate.js` (paid plans only).
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Free plans have no pre-deploy step: migrate, then start (the Dockerfile's CMD otherwise).
    dockerCommand: /bin/sh -c "node dist/migrate.js && exec node --enable-source-maps dist/index.js"
    autoDeploy: true
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKERS
        value: 'true'
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: AGENT_CONCURRENCY
        value: '2'
      - key: PLAYTESTS
        value: 'false'
      - key: FORGE_SMOKE
        value: 'false'
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_API_BASE
        value: https://api.sg-light-api.com
      - key: NEXCONN_API_BACKUP
        value: https://api-b.sg-light-api.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Agents on Google's free Gemini tier (no card). For Claude instead: AI_PROVIDER=anthropic,
      # ANTHROPIC_API_KEY, ANTHROPIC_MODEL=claude-haiku-5-5, ANTHROPIC_BUILD_MODEL=claude-sonnet-5-5.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Signs session cookies. Render generates a random value once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_MAX_SKEW_MS
        value: '600000'
      - key: DAILY_BUDGET_USD
        value: '25'
