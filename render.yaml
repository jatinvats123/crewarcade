# Render Blueprint: the CrewArcade server as ONE Docker web service (API, webhooks, pg-boss
# workers, Playwright playtest worker). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: crewarcade-server
    runtime: docker
    region: singapore # next to Nexconn SG and Supabase ap-southeast-1
    # Standard (2 GB, 1 CPU, never sleeps): headless Chromium runs Glitch's playtests and bug repros
    # and Forge's smoke test, so games can be tested, fixed and published. Free (512 MB) can't run
    # Chromium: there set PLAYTESTS/FORGE_SMOKE to 'false', MIGRATE_ON_START to 'true' and drop
    # preDeployCommand (free plans have no pre-deploy step).
    plan: standard
    preDeployCommand: node dist/migrate.js
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKERS
        value: 'true'
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: '8'
      - key: AGENT_CONCURRENCY
        value: '3'
      - key: PLAYTESTS
        value: 'true'
      - key: FORGE_SMOKE
        value: 'true'
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_API_BASE
        value: https://api.sg-light-api.com
      - key: NEXCONN_API_BACKUP
        value: https://api-b.sg-light-api.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Agents on Google's free Gemini tier (no card). For Claude instead: AI_PROVIDER=anthropic,
      # ANTHROPIC_API_KEY, ANTHROPIC_MODEL=claude-haiku-5-5, ANTHROPIC_BUILD_MODEL=claude-sonnet-5-5.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: TEAM_USER_IDS
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Signs session cookies. Render generates a random value once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_MAX_SKEW_MS
        value: '600000'
      - key: DAILY_BUDGET_USD
        value: '25'
